name: Publication safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check publication inputs
        run: |
          python3 tools/check_publication.py
      - name: Test native privacy fallback and collector hooks
        run: python3 -m unittest discover -s tests -v
      - name: Scan history and working tree
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
        run: |
          docker pull "$GITLEAKS_IMAGE"
          docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo:ro" "$GITLEAKS_IMAGE" \
            git /repo --log-opts=--all --redact=100 --no-banner
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/repo:ro" "$GITLEAKS_IMAGE" \
            dir /repo --redact=100 --no-banner
