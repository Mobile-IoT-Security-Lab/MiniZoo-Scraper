name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  module:
    name: ${{ matrix.module }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        module: [discovery, collection, version, core, cli]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: python minizoo.py test ${{ matrix.module }}
