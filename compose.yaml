x-config-mount: &config-mount
  type: bind
  source: ${WECHAT_CONFIG_DIR:-./private/config}
  target: /config
  read_only: true
  bind:
    create_host_path: false
x-input-mount: &input-mount
  type: bind
  source: ${WECHAT_INPUT_DIR:-./private/input}
  target: /input
  read_only: true
  bind:
    create_host_path: false
x-data-mount: &data-mount
  type: bind
  source: ${WECHAT_DATA_DIR:-./collection_results}
  target: /data
  bind:
    create_host_path: false
x-runtime: &runtime
  image: minizoo-scraper:public
  build: .
  # All roles share the same loopback ADB server and Frida tunnels.
  # Docker Desktop needs Settings > Resources > Network > Enable host networking.
  network_mode: host
  init: true
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  mem_limit: 2g
  cpus: 2.0
  environment:
    ADB_SERVER_SOCKET: tcp:127.0.0.1:5037
    WECHAT_DATA_DIR: /data/initial
    MINIZOO_DATA_DIR: /data
    MINICRAWLER_SOURCE: /opt/minicrawler
    WECHAT_STATE_DIR: /data/automation
  volumes:
    - *config-mount
    - *input-mount
    - *data-mount
  stop_grace_period: 2m

services:
  discovery:
    <<: *runtime
    entrypoint: ["python3", "/opt/wechat/minizoo.py", "discovery"]
    command: ["--help"]
    volumes:
      - *config-mount
      - *input-mount
      - *data-mount
      - type: bind
        source: ${MINICRAWLER_DIR:-./private/dependencies/MiniCrawler}
        target: /opt/minicrawler
        read_only: true
        bind:
          create_host_path: false
  collection:
    <<: *runtime
    entrypoint: ["python3", "/opt/wechat/minizoo.py", "collection"]
    command: ["--help"]
  version:
    <<: *runtime
    entrypoint: ["python3", "/opt/wechat/minizoo.py", "version"]
    command: ["--help"]
  # Compatibility/tool shell, selected explicitly by `docker compose run collector ...`.
  collector:
    <<: *runtime
    profiles: ["tools"]
    command: ["help"]
  # Explicitly start only for version navigation; no phone session starts here.
  appium:
    profiles: ["appium"]
    image: minizoo-appium:public
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Appium.Dockerfile
      platforms: ["linux/amd64"]
    network_mode: host
    init: true
    environment:
      APPIUM_PORT: ${APPIUM_PORT:-4723}
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.APPIUM_PORT||4723)+'/status').then(async r=>{if(!r.ok||!(await r.json()).value.ready)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    stop_grace_period: 30s
